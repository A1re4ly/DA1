<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NovaHM</title>
    <link rel="stylesheet" href="asset/login.css">
</head>
<body>

    <!-- Logo góc trên bên trái -->
    <div class="logo-top-left">
        <span class="logo-icon">❖</span> NovaHM
    </div>

    <div class="form-container">
        <p class="subtitle">Vui lòng điền thông tin đăng nhập</p>
        <h2>Welcome back</h2>
        
        <form action="#" method="POST">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="name@company.vn" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Nhớ mật khẩu
                </label>
                <a href="#" class="forgot-password">Quên mật khẩu</a>
            </div>

            <!-- Đã sửa text từ Sign up thành Sign in cho đúng logic -->
            <button type="submit" class="btn-submit">Đăng nhập</button>
</body>
</html>
