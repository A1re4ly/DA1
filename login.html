<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NovaHM</title>
    <link rel="stylesheet" href="asset/login.css">
</head>
<body>

    <!-- Logo góc trên bên trái -->
    <div class="logo-top-left">
        <span class="logo-icon">❖</span> NovaHM
    </div>

    <div class="form-container">
        <p class="subtitle">Vui lòng điền thông tin đăng nhập</p>
        <h2>Welcome back</h2>
        
        <form action="#" method="POST">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="name@company.vn" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Nhớ mật khẩu
                </label>
                <a href="#" class="forgot-password">Quên mật khẩu</a>
            </div>

            <!-- Đã sửa text từ Sign up thành Sign in cho đúng logic -->
            <button type="submit" class="btn-submit">Đăng nhập</button>
            <!-- Liên kết nút đăng xuất ra ngoài -->
           <!-- Script kiểm tra đúng/sai tài khoản -->
    <script>
        // 1. Danh sách tài khoản hợp lệ mẫu (Mô phỏng Database)
        const validUsers = [
            { email: "admin@novacompany.vn", pass: "123456", name: "Quản trị viên", role: "Admin" },
        ];

        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();

            // Lấy thông tin từ form
            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('password').value.trim();

            // 2. Kiểm tra xem thông tin nhập vào có khớp với tài khoản nào không
            const matchedUser = validUsers.find(user => user.email === emailInput && user.pass === passInput);

            // 3. Xử lý kết quả
            if (matchedUser) {
                // ĐÚNG TÀI KHOẢN: Lưu thông tin người dùng vào trình duyệt
                localStorage.setItem('userLoggedIn', matchedUser.name);
                localStorage.setItem('userRole', matchedUser.role);

                // Chuyển sang trang Dashboard
                window.location.href = 'index.html';
            } else {
                // SAI TÀI KHOẢN: Báo lỗi và không cho chuyển trang
                alert('Tài khoản hoặc mật khẩu không chính xác!');
            }
        });
    </script>
</body>
</body>
</html>
